<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Drive Simulator</title>
<style>
*{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px;
    background: #111418;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.welcome-screen {
    width: min(420px, 100%);
    min-height: 360px;
    padding: 35px 25px 30px;
    background: linear-gradient(145deg, #78858e, #626e76);
    border: 1px solid #8f9da6;
    border-radius: 12px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.8), inset 0 1px 1px rgba(255,255,255,.4), inset 0 -2px 5px rgba(0,0,0,.4);
    color: #f2f4f5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 32px;
    text-align: center;
}
.welcome-display-frame {
    width: 100%;
    padding: 10px;
    background: #202428;
    border: 2px solid #14171a;
    border-radius: 6px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 2px 4px rgba(255,255,255,.15);
}
.welcome-display {
    min-height: 125px;
    padding: 16px 12px;
    background: linear-gradient(180deg, #cbe232 0%, #b3cd20 100%);
    border: 3px inset #819121;
    border-radius: 3px;
    color: #121c00;
    box-shadow: inset 0 0 12px rgba(60,70,0,.6);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
.welcome-screen h1 {
    margin: 0;
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 25px;
    font-weight: normal;
    letter-spacing: 1px;
}
.welcome-screen p {
    margin: 0;
    font-size: 14px;
    color: #253000;
}
.start-button {
    padding: 12px 24px;
    border: 2px solid #d9e2e7;
    border-radius: 6px;
    background: #202428;
    color: #d6e82a;
    font: bold 16px 'Segoe UI', Tahoma, sans-serif;
    letter-spacing: 1px;
    cursor: pointer;
}
.start-button:hover { background: #343b42; }

.drive{
    display: none;
    width: 420px;
    padding: 35px 25px 30px;
    background: linear-gradient(145deg, #78858e, #626e76);
    border: 1px solid #8f9da6;
    border-radius: 12px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.8), inset 0 1px 1px rgba(255,255,255,.4), inset 0 -2px 5px rgba(0,0,0,.4);
    flex-direction: column;
    align-items: center;
    gap: 32px;
}

.display-frame {
    width: 100%;
    padding: 10px;
    background: #202428;
    border: 2px solid #14171a;
    border-radius: 6px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 2px 4px rgba(255,255,255,.15);
}
.display {
    height: 100px;
    padding: 10px 12px;
    background: linear-gradient(180deg, #cbe232 0%, #b3cd20 100%);
    border: 3px inset #819121;
    border-radius: 3px;
    color: #121c00;
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 24px;
    font-weight: normal;
    letter-spacing: 1px;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    box-shadow: inset 0 0 12px rgba(60,70,0,.6);
    text-align: left;
}

.line{
    width: 100%;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    white-space: nowrap;
    text-align: left;
}
.level-number { margin-left: auto; padding-left: 8px; }
.display.level-four { align-items: center; text-align: center; }
.display.level-four .line { justify-content: center; text-align: center; }

.keypad-container{
    width: 250px;
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.keypad-outer-ring{
    width: 240px;
    height: 240px;
    padding: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b97a0, #546068);
    box-shadow: inset 0 3px 6px rgba(255,255,255,.5), inset 0 -4px 8px rgba(0,0,0,.6), 0 6px 12px rgba(0,0,0,.4);
}
.keypad-inner-recess{
    width: 100%;
    height: 100%;
    padding: 6px;
    position: relative;
    border-radius: 50%;
    background: #4e5961;
    box-shadow: inset 0 4px 10px rgba(0,0,0,.8);
}
.keypad-svg{
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
}
.keypad-border{
    fill: none;
    stroke: #101417;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    pointer-events: none;
}
.key-sector{
    fill: #252a2f;
    stroke: #101316;
    stroke-width: 2.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: transform .08s ease, filter .08s ease, fill .08s ease;
    transform-origin: 100px 100px;
}
.key-sector:hover{ fill: #343b42; }
.key-sector:active, .key-sector.active{ fill: #151719 !important; transform: scale(.97); }
.key-symbol{
    fill: #8a96a0;
    font-size: 22px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
    dominant-baseline: central;
}
.key-sector:active + .key-symbol, .key-sector.active + .key-symbol{ fill: #fff !important; }
.center-dot{
    fill: #4e5961;
    stroke: #101417;
    stroke-width: 4;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
}
.title{ color: #ddd; text-align: center; font-size: 13px; letter-spacing: 2px; margin: 0; }
.status{ text-align: center; color: #9aa7b0; font-size: 13px; margin: 0; }
.brand-badge{
    background: #d9d9d9;
    border: 2px solid #b8c4ce;
    border-radius: 3px;
    padding: 3px 4px;
    display: flex;
    align-items: center;
    gap: 3px;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
}
.brand-sprint,
.brand-electric{
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.15;
    font-weight: 900;
    padding: 1px 5px;
    white-space: nowrap;
}
.brand-sprint{
    background: #171717;
    letter-spacing: .2px;
}
.brand-electric{
    background: #ed1c24;
    letter-spacing: .2px;
}

@media (max-width: 480px) {
    body {
        min-height: 100vh;
        min-height: 100svh;
        padding: 16px 12px;
        align-items: flex-start;
        overflow-x: hidden;
    }
    .welcome-screen {
        width: 100%;
        min-height: 340px;
        padding: 22px 14px;
        gap: 22px;
    }
    .welcome-screen h1 { font-size: clamp(21px, 6vw, 25px); }
    .drive {
        width: 100%;
        padding: 22px 14px;
        gap: 22px;
    }
    .keypad-container {
        width: min(250px, 78vw);
        height: min(250px, 78vw);
    }
    .keypad-outer-ring {
        width: min(240px, 75vw);
        height: min(240px, 75vw);
    }
    .brand-sprint, .brand-electric { font-size: 14px; }
}
</style>

let navPath = [], idxPath = [], isStart = false, editMode = false, ratedArmAmps = 0, audioContext = null;

document.getElementById('startButton').addEventListener('click', () => {
    playButtonSound();
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('driveSimulator').style.display = 'flex';

    idxPath = [1];

function playButtonSound(){ try{ audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==='suspended')audioContext.resume(); const o=audioContext.createOscillator(),g=audioContext.createGain(),n=audioContext.currentTime; o.type='square';o.frequency.setValueAtTime(650,n);o.frequency.exponentialRampToValueAtTime(180,n+.055);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.055);o.connect(g);g.connect(audioContext.destination);o.start(n);o.stop(n+.055); }catch(error){} }



  
  function getCurrNode(){let node=menuTree;for(const key of navPath)node=node[key];return node;}
function getCurrKeys(){const node=getCurrNode();return !node?[]:Array.isArray(node)?node:typeof node==='object'?Object.keys(node):[];}


  
function setDisplayLine(line,label,level=''){line.replaceChildren();const labelSpan=document.createElement('span');labelSpan.className='line-label';labelSpan.textContent=label;line.appendChild(labelSpan);if(level){const levelSpan=document.createElement('span');levelSpan.className='level-number';levelSpan.textContent=level;line.appendChild(levelSpan);}}
function render(activeKey=null){if(activeKey){const el=document.getElementById(activeKey);if(el){el.classList.add('active');setTimeout(()=>el.classList.remove('active'),150);}}const l1=document.getElementById('line1'),l2=document.getElementById('line2'),l3=document.getElementById('line3');if(isStart){document.querySelector('.display').classList.remove('level-four');setDisplayLine(l1,'PRESS RIGHT KEY FOR');setDisplayLine(l2,'ENTRY MENU','1');l3.textContent='';return;}const titleLevel=navPath.length+1,itemLevel=titleLevel+1,keys=getCurrKeys(),currIdx=idxPath[idxPath.length-1]||0,currNode=getCurrNode();document.querySelector('.display').classList.toggle('level-four',itemLevel===4);if(editMode){l1.textContent='RATED ARM AMPS';l2.textContent=String(ratedArmAmps).padStart(3,'0')+'.0 A     EDIT';return;}if(currNode==='MONITOR'){const parentName=navPath[navPath.length-2]||'DIAGNOSTICS',paramName=navPath[navPath.length-1];setDisplayLine(l1,parentName);setDisplayLine(l2,paramName,itemLevel<4?String(itemLevel):'');l3.textContent='0.00%';return;}setDisplayLine(l1,navPath.length===0?'ENTRY MENU':navPath[navPath.length-1].substring(0,20),titleLevel<4?String(titleLevel):'');setDisplayLine(l2,keys.length>0?keys[currIdx].substring(0,20):'',keys.length>0&&itemLevel<4?String(itemLevel):'');l3.textContent='';}
function keyUp(){if(isStart)return;if(editMode){ratedArmAmps=Math.min(999,ratedArmAmps+1);render('btnUp');return;}const keys=getCurrKeys();if(keys.length)idxPath[idxPath.length-1]=(idxPath[idxPath.length-1]-1+keys.length)%keys.length;render('btnUp');}
function keyDown(){if(isStart)return;if(editMode){ratedArmAmps=Math.max(0,ratedArmAmps-1);render('btnDown');return;}const keys=getCurrKeys();if(keys.length)idxPath[idxPath.length-1]=(idxPath[idxPath.length-1]+1)%keys.length;render('btnDown');}
function keyRight(){if(isStart){isStart=false;navPath=[];idxPath=[1];render('btnRight');return;}if(editMode)return;const keys=getCurrKeys(),currIdx=idxPath[idxPath.length-1];if(currIdx===undefined||!keys[currIdx]){render('btnRight');return;}const selectedKey=keys[currIdx],currentNode=getCurrNode(),nextNode=Array.isArray(currentNode)?currentNode[currIdx]:currentNode[selectedKey];if(Array.isArray(currentNode)&&selectedKey==='2)RATED ARM AMPS'){editMode=true;render('btnRight');return;}if(Array.isArray(nextNode)&&!nextNode.length)return;if(nextNode!==undefined&&nextNode!==null){navPath.push(selectedKey);idxPath.push(0);}render('btnRight');}
function keyLeft(){if(isStart)return;if(editMode){editMode=false;render('btnLeft');return;}if(navPath.length){navPath.pop();idxPath.pop();}else isStart=true;render('btnLeft');}
let holdTimer=null,holdDelayTimer=null;function stopHold(){if(holdDelayTimer!==null){clearTimeout(holdDelayTimer);holdDelayTimer=null;}if(holdTimer!==null){clearInterval(holdTimer);holdTimer=null;}}
function addHoldButton(id,action){const button=document.getElementById(id);button.addEventListener('pointerdown',e=>{e.preventDefault();stopHold();playButtonSound();action();holdDelayTimer=setTimeout(()=>{holdTimer=setInterval(()=>{playButtonSound();action();},120);},800);button.setPointerCapture?.(e.pointerId);});['pointerup','pointercancel','pointerleave'].forEach(name=>button.addEventListener(name,stopHold));}
addHoldButton('grpUp',keyUp);addHoldButton('grpDown',keyDown);addHoldButton('grpLeft',keyLeft);addHoldButton('grpRight',keyRight);
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'){playButtonSound();keyUp();}else if(e.key==='ArrowDown'){playButtonSound();keyDown();}else if(e.key==='ArrowLeft'){playButtonSound();keyLeft();}else if(e.key==='ArrowRight'||e.key==='Enter'){playButtonSound();keyRight();}});render();
</script>
</body>
</html>
